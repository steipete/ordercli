name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - go-version: "1.27.0"
            check: "1.27.0"
          # Preserve the required status name while testing the patched compiler.
          - go-version: "1.27.4"
            check: "1.27.1"
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: test + coverage (>= 75%)
        run: |
          set -euo pipefail
          go test ./... -coverprofile=cover.out
          total="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')"
          echo "total_coverage=${total}%"
          awk -v c="$total" 'BEGIN { exit !(c >= 75.0) }'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=3m

  macos-release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check release metadata and deployment-target regressions
        run: |
          ./scripts/check-release-metadata
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          install-only: true
      - name: Check and build release matrix (including macOS 13 gate)
        run: |
          goreleaser check
          goreleaser build --snapshot --clean
      - name: Smoke-test both macOS architectures
        run: |
          arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
          for target in amd64 arm64; do
            for binary in dist/ordercli_darwin_"${target}"*/ordercli; do
              test -x "$binary"
              if [ "$target" = amd64 ]; then
                arch -x86_64 "$binary" --version
              else
                "$binary" --version
              fi
            done
          done
